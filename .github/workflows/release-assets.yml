name: Attach verified installers to draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (vX.Y.Z)
        required: true
      build_run:
        description: Successful installer workflow run ID
        required: true
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Validate successful build and matching draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          test "$(jq -r .conclusion run.json)" = success
          test "$(jq -r .path run.json)" = .github/workflows/packages.yml
          gh api "repos/$GH_REPO/releases" --paginate --jq ".[]|select(.tag_name==\"$RELEASE_TAG\")" > release.json
          test -s release.json
          test "$(jq -r .draft release.json)" = true
          test "$(jq -r .tag_name release.json)" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish release.json)" = "$(jq -r .head_sha run.json)"
      - name: Download and attach installers
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" -n windows-installer -D windows
          gh run download "$BUILD_RUN" -n linux-installers -D linux
          files=("windows/RestTimer-$RELEASE_TAG-windows-x64-setup.exe"
                 "linux/RestTimer-$RELEASE_TAG-linux-amd64.deb"
                 "linux/RestTimer-$RELEASE_TAG-linux-x86_64.rpm")
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}"
          # Recheck the draft immediately before changing its assets.
          test "$(gh api "repos/$GH_REPO/releases/$(jq -r .id release.json)" --jq .draft)" = true
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
